# Docker Compose configuration for notes-mcp
# Generated by genproj (docker-container capability).
#
# Deploy with: docker compose up -d
# (On Synology, import this file as a Container Manager "Project".)
#
# The image reference uses your registry namespace (GitHub username/org for
# GHCR). For public packages no registry credentials are required on the host.

services:
  app:
    image: ghcr.io/nickbrett1/notes-mcp:latest
    container_name: notes-mcp
    restart: unless-stopped

    ports:
      - "0.0.0.0:8767:8767"
    volumes:
      - /volumeUSB1/usbshare/docker/obsidian/vault:/vault:ro
    environment:
      # Set your environment variables here or in a NAS-side .env file
      # (genproj never commits secrets). See .env.example.
      NOTES_VAULT: ${NOTES_VAULT:-/vault}
      NOTES_PORT: ${NOTES_PORT:-8767}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      # Homepage entry is defined manually in Homepage's services.yaml under
      # the "MCP Servers" group (icon + description + alphabetical order).
      # Homepage prepends label-discovered services, so label-based discovery
      # cannot reproduce the neighbours' alphabetical placement.
    networks:
      - ai_proxy
networks:
  ai_proxy:
    external: true
